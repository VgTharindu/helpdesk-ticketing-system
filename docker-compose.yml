services:                           
  mysql:                            
    image: mysql:8.0 
    restart: unless-stopped               
    container_name: helpdesk-mysql  
    environment:                    
      MYSQL_DATABASE: helpdesk      
      MYSQL_USER: helpdesk          
      MYSQL_PASSWORD: secret        
      MYSQL_ROOT_PASSWORD: rootsecret   
    ports:
      - "3306:3306"                 
    volumes:
      - mysql_data:/var/lib/mysql   

volumes:
  mysql_data:                      